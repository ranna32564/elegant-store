<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — ELEGANT</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<div class="page-loader"><div style="text-align:center"><div class="page-loader__mark">Elegant</div><div class="page-loader__bar"><i></i></div></div></div>
<header class="site-header" data-chrome="header"></header>
<main><section class="section wrap"><div class="auth-wrap"><div class="form-card">
<p class="eyebrow">Welcome back</p><h1 class="serif" style="font-size:2rem">Sign in to ELEGANT</h1>
<p class="muted" style="margin:10px 0 26px">Sign in to unlock checkout, order history and your invoice.</p>
<form id="loginForm" novalidate>
<label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required><em class="err" data-err="email"></em></label>
<label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required><em class="err" data-err="password"></em></label>
<button class="btn btn--primary btn--block" type="submit">Sign In</button>
</form>
<p class="hint" style="margin-top:16px"><a href="reset-password.html" style="color:var(--rose)">Forgot password?</a></p><p class="hint" style="margin-top:12px">New here? <a href="signup.html" style="color:var(--rose)">Create an account</a></p>
</div><div class="auth-aside"><img src="images/hero.png" alt="ELEGANT editorial still life"><p class="auth-aside__quote">“Considered, never excessive.”</p></div></div></section></main>
<footer class="site-footer" data-chrome="footer"></footer>
<script src="js/api.js"></script><script src="js/cart.js"></script><script src="js/auth.js"></script><script src="js/main.js"></script>
</body></html>
