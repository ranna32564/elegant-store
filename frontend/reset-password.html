<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — ELEGANT</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head><body data-page="reset"><div class="page-loader"><div style="text-align:center"><div class="page-loader__mark">Elegant</div><div class="page-loader__bar"><i></i></div></div></div><header class="site-header" data-chrome="header"></header><main><section class="section wrap"><div class="auth-wrap"><div class="form-card"><p class="eyebrow">Account security</p><h1 class="serif" style="font-size:2rem">Reset your password</h1><p class="muted" style="margin:10px 0 26px">We’ll send a one-time code to your email.</p><form id="resetForm"><label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label><label class="field"><span>Verification code</span><input name="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" required></label><label class="field"><span>New password</span><input name="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><label class="field"><span>Confirm password</span><input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn--ghost" id="sendReset" type="button">Send code</button><button class="btn btn--primary" type="submit">Reset Password</button></div></form><p class="hint" style="margin-top:20px"><a href="login.html">Back to sign in</a></p></div><div class="auth-aside"><img src="images/hero.png" alt="ELEGANT editorial still life"><p class="auth-aside__quote">“Considered, never excessive.”</p></div></div></section></main><footer class="site-footer" data-chrome="footer"></footer><script src="js/api.js"></script><script src="js/cart.js"></script><script src="js/auth.js"></script><script src="js/main.js"></script></body></html>
