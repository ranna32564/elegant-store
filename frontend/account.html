<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Account — ELEGANT</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="account"><div class="page-loader"><div style="text-align:center"><div class="page-loader__mark">Elegant</div><div class="page-loader__bar"><i></i></div></div></div><header class="site-header" data-chrome="header"></header>
<main class="wrap section--tight">
<div class="form-card" style="margin-bottom:20px"><p class="eyebrow">My account</p><h1 class="serif" id="acctName">Loading…</h1><p class="muted" id="acctEmail"></p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn btn--ghost" id="logoutBtn">Sign out</button></div></div>
<div class="acct-nav" style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap"><button class="btn btn--ghost active" data-tab="orders">My Orders</button><button class="btn btn--ghost" data-tab="profile">Profile</button><button class="btn btn--ghost" data-tab="wishlist">Wishlist</button><button class="btn btn--ghost" data-tab="security">Security</button></div>
<section data-panel="orders"><div id="orderList"></div></section>
<section data-panel="profile" hidden><form class="form-card" id="profileForm"><p class="eyebrow">Personal details</p><label class="field"><span>Name</span><input name="name" autocomplete="name"></label><label class="field"><span>Phone</span><input name="phone" autocomplete="tel"></label><label class="field"><span>Address</span><input name="line1" autocomplete="street-address"></label><label class="field"><span>City</span><input name="city" autocomplete="address-level2"></label><label class="field"><span>Postcode</span><input name="postcode" autocomplete="postal-code"></label><button class="btn btn--primary" type="submit">Save Profile</button></form></section>
<section data-panel="wishlist" hidden><div id="acctWish" class="product-grid"></div></section>
<section data-panel="security" hidden><div class="form-card" style="margin-bottom:20px"><p class="eyebrow">Security</p><h2 class="serif">Change password</h2><form id="passwordForm"><label class="field"><span>Current password</span><input name="currentPassword" type="password" autocomplete="current-password" required></label><label class="field"><span>New password</span><input name="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><label class="field"><span>Confirm new password</span><input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn btn--primary" type="submit">Update Password</button></form></div>
<div class="form-card"><p class="eyebrow">Danger zone</p><h2 class="serif">Delete account</h2><p class="muted">This permanently removes your customer account. You must enter your current password to continue.</p><form id="deleteAccountForm" style="margin-top:14px"><label class="field"><span>Account password</span><input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn--ghost" type="submit">Delete My Account</button></form></div></section>
</main><footer class="site-footer" data-chrome="footer"></footer><script src="js/api.js"></script><script src="js/cart.js"></script><script src="js/auth.js"></script><script src="js/main.js"></script></body></html>
