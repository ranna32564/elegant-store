<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Bag — ELEGANT</title>
<meta name="description" content="Review the pieces in your ELEGANT bag and continue to secure checkout.">
<meta property="og:title" content="Your Bag — ELEGANT">
<meta property="og:description" content="Review the pieces in your ELEGANT bag and continue to secure checkout.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
<div class="page-loader"><div style="text-align:center"><div class="page-loader__mark">Elegant</div><div class="page-loader__bar"><i></i></div></div></div>

<header class="site-header" data-chrome="header"></header>

<main>

  <section class="page-head wrap">
    <p class="crumbs"><a href="index.html">Home</a> / Bag</p>
    <h1>Your Bag</h1>
    <div class="steps"><b>1 · Bag</b><span class="sep"></span><span>2 · Delivery</span><span class="sep"></span><span>3 · Payment</span></div>
  </section>

  <section class="section--tight wrap">
    <div class="cart-layout">
      <div>
        <div id="cartItems"></div>
        <button class="btn btn--ghost btn--sm" id="clearCart" type="button">Empty bag</button>
      </div>
      <aside class="summary" id="cartSummary">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span data-sub>৳0</span></div>
        <div class="summary-row"><span>Delivery</span><span data-ship>Free</span></div>
        <div class="summary-row summary-row--total"><span>Total</span><span data-total>৳0</span></div>
        <p class="hint" data-ship-note style="margin:12px 0 20px"></p>
        <a class="btn btn--primary btn--block" href="checkout.html">Proceed to Checkout</a>
        <a class="btn btn--ghost btn--block" href="shop.html" style="margin-top:10px">Continue shopping</a>
      </aside>
    </div>
  </section>

</main>

<footer class="site-footer" data-chrome="footer"></footer>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
